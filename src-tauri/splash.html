<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciando Aplicativo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
    }

    .wrapper {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }

    .card {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0d0d14 0%, #11111d 60%, #0a0a12 100%);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(0,0,0,0.85), 0 0 100px rgba(99,102,241,0.12);
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 36px 44px 30px;
      position: relative; overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Glow blobs */
    .blob-top {
      position: absolute; top: -35%; left: -25%;
      width: 75%; height: 75%;
      background: radial-gradient(circle, rgba(99,102,241,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .blob-bottom {
      position: absolute; bottom: -35%; right: -25%;
      width: 75%; height: 75%;
      background: radial-gradient(circle, rgba(168,85,247,0.20) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Content */
    .content {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; z-index: 1; flex: 1; justify-content: center;
    }

    .logo-box {
      width: 76px; height: 76px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 12px rgba(99,102,241,0.15);
      backdrop-filter: blur(12px);
      overflow: hidden;
      padding: 10px;
    }

    .logo-box img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }

    .logo-svg-fallback {
      width: 44px; height: 44px;
      color: #818cf8;
    }

    h1 {
      font-size: 28px; font-weight: 900;
      color: #ffffff; letter-spacing: -0.5px; line-height: 1.1;
      text-align: center;
      max-width: 460px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    h1 span {
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px; font-weight: 700;
      color: rgba(165,180,252,0.6);
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-top: -6px;
    }

    /* Footer */
    .footer { width: 100%; z-index: 1; }

    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    .status-left {
      display: flex; align-items: center; gap: 8px;
    }

    .spinner {
      width: 13px; height: 13px;
      border: 2px solid rgba(165,180,252,0.25);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 11px; font-weight: 500;
      color: rgba(212,212,216,0.85);
    }

    .pct {
      font-size: 11px; font-weight: 700;
      color: #818cf8;
    }

    .track {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px; overflow: hidden;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div class="wrapper" data-tauri-drag-region>
    <div class="card" data-tauri-drag-region>
      <div class="blob-top"></div>
      <div class="blob-bottom"></div>

      <div class="content" data-tauri-drag-region>
        <div class="logo-box" id="logo-box">
          <!-- ICON_PLACEHOLDER -->
          <svg class="logo-svg-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <h1 id="app-title"><span id="app-name">App</span></h1>
        <p class="subtitle">SISTEMA DESKTOP • <span id="version">v1.0.0</span></p>
      </div>

      <div class="footer">
        <div class="status-row">
          <div class="status-left">
            <div class="spinner"></div>
            <span class="status-text" id="status">Iniciando módulos do sistema...</span>
          </div>
          <span class="pct" id="pct">0%</span>
        </div>
        <div class="track">
          <div class="bar" id="bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const steps = [
      { p: 15, msg: 'Iniciando módulos do sistema...' },
      { p: 38, msg: 'Carregando ambiente seguro...' },
      { p: 65, msg: 'Conectando aos serviços...' },
      { p: 88, msg: 'Preparando interface...' },
      { p: 100, msg: 'Pronto!' }
    ];

    const bar    = document.getElementById('bar');
    const pct    = document.getElementById('pct');
    const status = document.getElementById('status');

    let step = 0;
    function tick() {
      if (step >= steps.length) return;
      const s = steps[step++];
      bar.style.width = s.p + '%';
      pct.textContent = s.p + '%';
      status.textContent = s.msg;
      if (step < steps.length) {
        setTimeout(tick, step === steps.length - 1 ? 550 : 420);
      }
    }

    requestAnimationFrame(() => setTimeout(tick, 80));
  </script>
</body>
</html>
